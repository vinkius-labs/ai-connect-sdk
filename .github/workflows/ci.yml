name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck · Build · Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        id: test
        run: |
          npm test -- --reporter=json --outputFile=test-results.json 2>&1 | tee test-output.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Parse test results
        if: always()
        id: results
        run: |
          if [ -f test-results.json ]; then
            TOTAL=$(jq '.numTotalTests' test-results.json)
            PASSED=$(jq '.numPassedTests' test-results.json)
            FAILED=$(jq '.numFailedTests' test-results.json)
            DURATION=$(jq '.testResults | map(.duration // 0) | add' test-results.json 2>/dev/null || echo "0")
            FILES=$(jq '.numTotalTestSuites' test-results.json)
          else
            TOTAL=0
            PASSED=0
            FAILED=0
            DURATION=0
            FILES=0
          fi
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "duration=$DURATION" >> $GITHUB_OUTPUT
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Notify Discord
        if: always() && matrix.node-version == 22
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ steps.test.outcome }}" = "success" ]; then
            STATUS="✅ Passed"
            COLOR=3066993
          else
            STATUS="❌ Failed"
            COLOR=15158332
          fi

          COMMIT_MSG=$(git log -1 --pretty=%s | head -c 100)
          COMMIT_SHA=$(git rev-parse --short HEAD)
          BRANCH="${GITHUB_REF_NAME}"
          ACTOR="${GITHUB_ACTOR}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          PAYLOAD=$(cat <<EOF
          {
            "embeds": [{
              "title": "$STATUS — @vinkius/connect CI",
              "url": "$RUN_URL",
              "color": $COLOR,
              "fields": [
                { "name": "Tests", "value": "${{ steps.results.outputs.passed }}/${{ steps.results.outputs.total }} passed", "inline": true },
                { "name": "Failed", "value": "${{ steps.results.outputs.failed }}", "inline": true },
                { "name": "Suites", "value": "${{ steps.results.outputs.files }}", "inline": true },
                { "name": "Branch", "value": "\`$BRANCH\`", "inline": true },
                { "name": "Commit", "value": "[\`$COMMIT_SHA\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) $COMMIT_MSG", "inline": false },
                { "name": "Author", "value": "$ACTOR", "inline": true }
              ],
              "footer": { "text": "Node ${{ matrix.node-version }} · ubuntu-latest" },
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }]
          }
          EOF
          )

          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
